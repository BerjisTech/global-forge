# GlobalForge — Smart International Pricing & DDP Calculator
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9ead8be52931337bd341e75d4b919a08"
name = "GlobalForge"
application_url = "https://global-forge.berjis.tech"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_products,write_products,read_orders,read_markets,read_shipping"

[auth]
redirect_urls = [ "https://global-forge.berjis.tech/api/auth" ]
